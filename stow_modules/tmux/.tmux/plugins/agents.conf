# Agents report state into pane options via ~/.tmux/scripts/agent-report
set -g focus-events on

# restore default session chooser (overrides stale bindings on reload)
bind-key s choose-tree -Zs
# display-popup doesn't expand formats in -e; run-shell does, shell-quoted once via #{q:}
bind-key a run-shell -b "tmux display-popup -c #{q:client_name} -e AGENT_CLIENT=#{q:client_name} -E -w 80% -h 50% ~/.tmux/scripts/agent-picker"

# focusing a done agent marks it seen
set-hook -g pane-focus-in[10] {
	if -F '#{==:#{@agent_state},done}' { set -p @agent_state idle }
}
