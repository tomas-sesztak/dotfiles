# Agent sidebar: agents report state into pane options via ~/.tmux/scripts/agent-report
if -F '#{@sidebar_width}' '' 'set -g @sidebar_width 32'
if -F '#{@agents_gen}' '' 'set -g @agents_gen 0'
set -g focus-events on

bind-key s run-shell -b '~/.tmux/scripts/agent-sidebar-toggle toggle'
bind-key a display-popup -E -w 80% -h 50% "~/.tmux/scripts/agent-picker '#{client_name}'"

set-hook -g after-new-window[10] 'run-shell -b "~/.tmux/scripts/agent-sidebar-toggle ensure"'
set-hook -g session-created[10] 'run-shell -b "~/.tmux/scripts/agent-sidebar-toggle ensure"'
set-hook -g pane-exited[10] 'run-shell -b "~/.tmux/scripts/agent-sidebar-toggle fix"'
set-hook -g after-kill-pane[10] 'run-shell -b "~/.tmux/scripts/agent-sidebar-toggle fix"'
set-hook -g window-resized[10] 'run-shell -b "~/.tmux/scripts/agent-sidebar-toggle fix"'

# sidebar is display-only: bounce focus off it; focusing a done agent marks it seen
set-hook -g pane-focus-in[10] {
	if -F '#{@sidebar}' { select-pane -R } {
		if -F '#{==:#{@agent_state},done}' {
			set -p @agent_state idle
			set -gF @agents_gen '#{e|+:#{@agents_gen},1}'
			wait-for -S agents-changed
		}
	}
}
