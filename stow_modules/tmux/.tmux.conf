# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# index from 1
set -g base-index 1

# Splits (matches herdr's prefix+h / prefix+v)
bind-key h split-window -v -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# Fullscreen (toggle zoom on the active pane)
bind-key z resize-pane -Z

bind r source-file ~/.tmux.conf

# Mouse mode
set -g mouse on

# double-click word selection: default separators minus '.' (keeps IPs whole)
set -g word-separators ' !"#$%&()*+,-/:;<=>?@[\]^`{|}~'"'"

# don't rename windows automatically
set-option -g allow-rename off

# DESIGN
# bell
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# copy mode
setw -g mode-keys vi
setw -g mode-style 'fg=#1a1b26 bg=#7aa2f7 bold'

# panes
set -g pane-border-style 'fg=#7aa2f7'
set -g pane-active-border-style 'fg=#9ece6a'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#a9b1d6 bg=#2a2f41'

# session name + vi-mode: tmux copy-mode (selection = VISUAL, else NORMAL), else zsh's @vimode (set by vi-mode.zsh)
set -g status-left '[#S] #{?pane_in_mode,#{?selection_present,#[bg=#bb9af7] VISUAL ,#[bg=#e0af68] NORMAL },#{?#{==:#{@vimode},VISUAL},#[bg=#bb9af7] VISUAL ,#{?#{==:#{@vimode},NORMAL},#[bg=#e0af68] NORMAL ,#{?#{==:#{@vimode},INSERT},#[bg=#9ece6a] INSERT ,}}}}#[default] '
set -g status-left-style 'fg=#1a1b26 bg=#7aa2f7 bold'
set -g status-left-length 30

set -g status-right '%H:%M %d-%m-%Y'
set -g status-right-style 'fg=#1a1b26 bg=#7aa2f7 bold'
set -g status-right-length 50

setw -g window-status-current-style 'fg=#a9b1d6 bg=#1a1b26 bold'
setw -g window-status-current-format ' #I #W #[fg=#e0af68]#F '

setw -g window-status-style 'fg=#a9b1d6 bg=#2a2f41'
setw -g window-status-format ' #I #W #[fg=#e0af68]#F '

# messages
set -g message-style 'fg=#1a1b26 bg=#f7768e bold'

# plugins
source-file -q ~/.tmux/plugins/init.conf

# window switcher
bind w display-popup -E "tmux list-windows -F '#I #W' | fzf --reverse | awk '{print \$1}' | xargs -I {} tmux select-window -t :{}"
