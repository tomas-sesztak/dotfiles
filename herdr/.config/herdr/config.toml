onboarding = false
[theme]
name = "tokyo-night"
auto_switch = false

[ui]
status_indicators = "symbols"

show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
[ui.toast]
delivery = "herdr"

[keys]
prefix = "ctrl+a"
reload_config = "prefix+r"
split_horizontal = "prefix+h"
split_vertical = "prefix+v"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/.config/herdr/scripts/smart-pane-nav.sh left"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/.config/herdr/scripts/smart-pane-nav.sh down"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/.config/herdr/scripts/smart-pane-nav.sh up"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/.config/herdr/scripts/smart-pane-nav.sh right"
